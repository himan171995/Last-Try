<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-latin-wght.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Noto Sans Devanagari";
        src: url("assets/fonts/noto-sans-devanagari-devanagari-500-normal.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Noto Sans Devanagari";
        src: url("assets/fonts/noto-sans-devanagari-devanagari-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Noto Sans Devanagari";
        src: url("assets/fonts/noto-sans-devanagari-devanagari-800-normal.woff2") format("woff2");
        font-weight: 800;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Inter", "Noto Sans Devanagari", sans-serif;
      }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="92.77"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="a-roll"
        class="clip"
        src="source.mp4"
        playsinline
        data-start="0"
        data-duration="92.77"
        data-track-index="0"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover" data-has-audio="true"></video>
      

      <!--
        Add your clips here. Example:
        <div id="title" class="clip" data-start="0" data-duration="5" data-track-index="1"
             style="font-size: 64px; color: #fff; padding: 40px">
          Hello World
        </div>
      -->
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // Example: tl.from("#title", { opacity: 0, y: -50, duration: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
